<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEXC × DEX Spread Scanner</title><style>
:root{color-scheme:dark;--bg:#080a0f;--panel:#10141c;--line:#222936;--muted:#7f8a9b;--text:#e9eef7;--green:#39d98a;--red:#ff5c68;--yellow:#ffc857}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1250px;margin:auto;padding:16px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}.title{font-size:20px;font-weight:800}.sub{color:var(--muted);font-size:12px}.controls{display:flex;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:12px;margin-bottom:12px}input,select,button{background:#151a24;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px}button{cursor:pointer;font-weight:700}button:hover{border-color:#4b5668}.stat{background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.table{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{color:var(--muted);font-size:11px;text-transform:uppercase;cursor:pointer}th:first-child,td:first-child{text-align:left}.sym{font-weight:800}.spread{font-weight:900}.hot{color:var(--red)}.good{color:var(--green)}.warn{color:var(--yellow)}a{color:#8db5ff;text-decoration:none}.badge{padding:3px 6px;border-radius:5px;background:#1b202b;color:var(--muted);font-size:11px}.loading{text-align:center;padding:35px;color:var(--muted)}.foot{color:var(--muted);font-size:11px;margin-top:10px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.title{font-size:17px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="title">MEXC × DEX Spread Scanner</div><div class="sub">MVP · только мониторинг · без торговли</div></div><button id="refresh">Обновить</button></div><div class="controls"><input id="search" placeholder="Токен, например XRP"><select id="sort"><option value="spread">Spread ↓</option><option value="change">MEXC 24h ↓</option><option value="liq">DEX liquidity ↓</option><option value="volume">MEXC volume ↓</option></select><label class="stat">Минимум spread <input id="min" type="number" value="15" step="1" style="width:65px;padding:5px">%</label><label class="stat"><input id="only" type="checkbox"> только MEXC &gt; DEX</label></div><div class="grid"><div class="stat">Найдено<br><b id="count">—</b></div><div class="stat">≥15%<br><b id="hotcount">—</b></div><div class="stat">Макс. spread<br><b id="max">—</b></div><div class="stat">Обновлено<br><b id="updated">—</b></div></div><div class="table"><div id="box" class="loading">Загружаем цены…</div></div><div class="foot">Spread = (MEXC / DEX − 1) × 100. DEX берётся из найденной наиболее ликвидной пары по тикеру. Перед реальной торговлей проверяй контракт, сеть, ликвидность и исполнимую цену.</div></div><script>
let rows=[];const $=id=>document.getElementById(id);function fmt(n){if(!n)return'—';if(n>=1)return n.toFixed(6);if(n>=.01)return n.toFixed(5);return n.toPrecision(5)}function money(n){if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(1)+'K';return'$'+n.toFixed(0)}function render(){let q=$('search').value.trim().toUpperCase(),min=+$('min').value||0,only=$('only').checked,sort=$('sort').value;let a=rows.filter(r=>(!q||r.symbol.includes(q))&&r.spread>=min&&(!only||r.spread>0));a.sort((x,y)=>sort==='change'?y.change24-x.change24:sort==='liq'?y.liquidity-x.liquidity:sort==='volume'?y.quoteVolume-x.quoteVolume:y.spread-x.spread);$('count').textContent=a.length;$('hotcount').textContent=rows.filter(r=>r.spread>=15).length;$('max').textContent=rows.length?rows.reduce((m,r)=>Math.max(m,r.spread),-Infinity).toFixed(1)+'%':'—';if(!a.length){$('box').innerHTML='<div class="loading">Ничего не найдено</div>';return}let h='<table><thead><tr><th>Token</th><th>MEXC</th><th>DEX</th><th>Spread</th><th>MEXC 24h</th><th>MEXC Vol</th><th>DEX Liquidity</th><th>DEX</th><th>Action</th></tr></thead><tbody>';for(const r of a){let cls=r.spread>=15?'hot':r.spread>0?'warn':'good';let act=r.spread>=15?'SHORT?':'—';h+=`<tr><td><span class="sym">${r.symbol}</span><br><span class="badge">${r.chain||'?'}</span></td><td>${fmt(r.price)}</td><td>${fmt(r.dexPrice)}</td><td class="spread ${cls}">${r.spread.toFixed(2)}%</td><td class="${r.change24>=0?'good':''}">${r.change24.toFixed(1)}%</td><td>${money(r.quoteVolume)}</td><td>${money(r.liquidity)}</td><td>${r.dex||'—'}</td><td>${r.url?`<a href="${r.url}" target="_blank">${act}</a>`:act}</td></tr>`}h+='</tbody></table>';$('box').innerHTML=h}async function load(){ $('box').innerHTML='<div class="loading">Обновляем рынок…</div>';try{let r=await fetch('/api/scan');rows=await r.json();if(!Array.isArray(rows))throw Error(rows.error||'API error');$('updated').textContent=new Date().toLocaleTimeString();render()}catch(e){$('box').innerHTML='<div class="loading">Ошибка: '+e.message+'</div>'}}$('refresh').onclick=load;['search','min','only','sort'].forEach(id=>$(id).addEventListener('input',render));load();setInterval(load,15000);
</script></body></html>
